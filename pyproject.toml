[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "bundlefit"
version = "0.0.1"
description = "Vision Utility for Bundle Adjustment"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "MikiyaShibuya", email = "mikiya.mail4univ@gmail.com" },
]
classifiers = [
    "License :: Pre-Open Source Verification License"
]

[project.urls]
Homepage = "https://github.com/opensrcai/bundlefit"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

cmake.args  = [
    "-DCMAKE_BUILD_TYPE=Release",  # not used on MSVC, but no harm
    # "-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake"
    # "-DVCPKG_MANIFEST_MODE=ON",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-Dbundlefit_BUILD_DEMO=OFF",
    "-Dbundlefit_ENABLE_PYTHON=ON",
    # https://discourse.cmake.org/t/how-to-fix-error-recompile-with-fpic/7626/2
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",
]

wheel.packages = [ "python_wrap/bundlefit" ]

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"
